# ============================================================
# Video Resumidor — Docker Compose
# v2.0 — Whisper + Ollama em containers com GPU
#
# Uso rápido:
#   docker compose up -d ollama ollama-pull     # subir e baixar modelo
#   VIDEO_DIR=./videos docker compose --profile run run --rm app /videos/video.mp4
#
# Variáveis de ambiente:
#   OLLAMA_MODEL    — modelo a baixar (default: qwen2.5:7b-instruct)
#   VIDEO_DIR       — pasta com vídeos (default: ./videos)
# ============================================================

services:

  # ─────────────────────────────────────────────
  # Ollama — servidor de LLM local com GPU
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama      # modelos persistentes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_NUM_GPU=1
      - OLLAMA_MAX_LOADED_MODELS=1     # evita estourar VRAM
      - OLLAMA_KEEP_ALIVE=5m           # libera VRAM após 5min ocioso
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Pull automático do modelo (roda uma vez)
  # ─────────────────────────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Baixando modelo ${OLLAMA_MODEL:-qwen2.5:7b-instruct}...' &&
        ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct} &&
        echo 'Modelo pronto!'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ─────────────────────────────────────────────
  # App — transcrição + resumo
  # ─────────────────────────────────────────────
  app:
    build: .
    container_name: video-resumidor
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - ${VIDEO_DIR:-./videos}:/videos    # pasta com seus vídeos
    environment:
      - OLLAMA_HOST=http://ollama:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - run   # só sobe com: docker compose --profile run up

volumes:
  ollama_data:
